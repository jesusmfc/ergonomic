<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Evaluación Ergonómica - RULA & ROSA</title>
    <style>
        /* --- CONFIGURACIÓN BASE (Gris Claro, Azul Oscuro y Blanco) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b; /* Gris muy oscuro para texto */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
            background-color: #f1f5f9; /* Fondo Gris Claro */
            
            /* Sutil patrón de fondo profesional */
            background-image: linear-gradient(rgba(241, 245, 249, 0.9), rgba(241, 245, 249, 0.9)), 
                              url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1280');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* Encabezado Azul Oscuro */
        header {
            background-color: #0f172a; /* Azul Oscuro profundo */
            color: #ffffff;
            text-align: center;
            padding: 35px 15px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.15);
            border-bottom: 5px solid #2563eb; /* Línea de acento Azul Brillante */
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        header p {
            margin: 8px 0 0 0;
            font-size: 13px;
            letter-spacing: 2px;
            color: #93c5fd; /* Azul claro para contraste */
            text-transform: uppercase;
        }

        /* Tarjeta Central Blanca */
        .container {
            max-width: 750px;
            background-color: #ffffff; /* Blanco Puro */
            margin: 40px auto;
            padding: 35px;
            border-radius: 10px;
            border: 1px solid #e2e8f0; /* Borde gris suave */
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px 15px;
                padding: 20px;
            }
            header h1 {
                font-size: 22px;
            }
        }

        /* Títulos de sección en Azul Oscuro */
        .section-title {
            color: #1e3a8a; /* Azul Marino */
            border-left: 5px solid #2563eb; /* Detalle azul brillante */
            padding-left: 12px;
            margin: 30px 0 20px 0;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Subtítulos para organizar parámetros internos */
        .subsection-title {
            font-size: 14px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* Formularios */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f172a; /* Texto de etiquetas en Azul Oscuro */
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1; /* Gris medio */
            border-radius: 6px;
            background-color: #ffffff;
            font-size: 14px;
            color: #1e293b;
            outline: none;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        select:focus {
            border-color: #2563eb; /* Foco cambia a Azul */
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.2);
        }

        /* Contenedor de Checkboxes Acumulativos */
        .checkbox-container {
            background-color: #f8fafc; /* Gris extra claro */
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #cbd5e1;
            margin-top: 10px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 13.5px;
            color: #334155;
            font-weight: 500;
        }

        .checkbox-option:last-child {
            margin-bottom: 0;
        }

        .checkbox-option input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: #2563eb; /* Checkbox color azul */
            cursor: pointer;
        }

        /* Botón de Acción Azul Oscuro */
        button {
            width: 100%;
            background-color: #1e3a8a; /* Azul Oscuro */
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8; /* Azul más brillante al pasar el cursor */
        }

        button:active {
            transform: scale(0.98);
        }

        /* Caja Dinámica de Métodos */
        .metodo-seccion {
            display: none;
        }

        .active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cuadro de Resultados */
        .resultado-box {
            margin-top: 30px;
            padding: 22px;
            border-radius: 6px;
            font-size: 16px;
            display: none;
            border: 1px solid #cbd5e1;
            transition: all 0.3s ease;
            line-height: 1.5;
        }

        /* Semáforo de riesgo adaptado a la nueva paleta */
        .resultado-bajo {
            background-color: #f0fdf4;
            border-left: 6px solid #16a34a;
            color: #14532d;
        }

        .resultado-medio {
            background-color: #fffbeb;
            border-left: 6px solid #d97706;
            color: #78350f;
        }

        .resultado-alto {
            background-color: #fef2f2;
            border-left: 6px solid #dc2626;
            color: #7f1d1d;
        }

        /* MARCA DE AGUA INFERIOR DERECHA */
        .marca-agua {
            position: fixed;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            color: #0f172a;
            font-weight: bold;
            letter-spacing: 1px;
            user-select: none;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 14px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Plataforma de Evaluación Ergonómica</h1>
        <p>Gestión de Riesgos Ocupacionales Avanzada</p>
    </header>

    <div class="container">
        
        <div class="form-group">
            <label for="metodoSeleccionado">Seleccione el Método Científico a aplicar:</label>
            <select id="metodoSeleccionado" onchange="cambiarMetodo()">
                <option value="rula">RULA (Carga postural en extremidades superiores)</option>
                <option value="rosa">ROSA (Puestos de oficina y pantallas PVD)</option>
            </select>
        </div>

        <div id="sec-rula" class="metodo-seccion active">
            <div class="section-title">Parámetros del Método RULA</div>
            <div class="form-group">
                <label>Posición del brazo (Hombros):</label>
                <select id="rula-brazo">
                    <option value="1">Postura neutra: Entre 20° de extensión y 20° de flexión (1)</option>
                    <option value="2">Flexión entre 20° y 45°, o extensión mayor a 20° (2)</option>
                    <option value="3">Flexión entre 45° y 90° (3)</option>
                    <option value="4">Flexión extrema mayor a 90° (4)</option>
                    <option value="5">Brazo rotado, hombro elevado o abducido de manera forzada (+1 adicional) (5)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ángulo y postura del cuello:</label>
                <select id="rula-cuello">
                    <option value="1">Flexión entre 0° y 10° (1)</option>
                    <option value="2">Flexión entre 10° y 20° (2)</option>
                    <option value="3">Flexión mayor a 20° (3)</option>
                    <option value="4">Extensión / Cuello inclinado hacia atrás (4)</option>
                    <option value="5">El cuello presenta rotación o inclinación lateral (+1 adicional) (5)</option>
                </select>
            </div>
        </div>

        <div id="sec-rosa" class="metodo-seccion">
            <div class="section-title">Parámetros del Método ROSA</div>
            
            <div class="form-group">
                <label>Puntuación de la Altura del Asiento (Postura Base):</label>
                <select id="rosa-silla-base">
                    <option value="1">Rodillas flectadas 90º aproximadamente (1 Punto)</option>
                    <option value="2">Asiento muy bajo. Ángulo de la rodilla &lt; 90º (2 Puntos)</option>
                    <option value="2_alto">Asiento muy alto. Ángulo de la rodilla &gt; 90º (2 Puntos)</option>
                    <option value="3">Sin contacto de los pies con el suelo (3 Puntos)</option>
                </select>
            </div>

            <div class="form-group">
                <span class="subsection-title">Factores adicionales de la silla (Acumulables):</span>
                <div class="checkbox-container">
                    <label class="checkbox-option">
                        <input type="checkbox" id="rosa-silla-espacio" value="1">
                        Espacio insuficiente para las piernas bajo la mesa (+1 punto)
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" id="rosa-silla-regulable" value="1">
                        La altura del asiento no es regulable (+1 punto)
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Ubicación de la Pantalla de Visualización (PVD):</label>
                <select id="rosa-pantalla">
                    <option value="1">Borde superior a la altura de los ojos y distancia adecuada (40-70 cm) (1)</option>
                    <option value="2">Pantalla muy baja, requiere flexión persistente de cuello (2)</option>
                    <option value="3">Pantalla muy alta, genera extensión cervical u obliga a girar el cuello (3)</option>
                    <option value="4">Presencia de reflejos molestos o pantalla no regulable (+1 adicional) (4)</option>
                </select>
            </div>
        </div>

        <button onclick="procesarEvaluacion()">Calcular Diagnóstico Ergonómico</button>

        <div id="resultado" class="resultado-box"></div>

    </div>

    <div class="marca-agua">creado por Frias y Prado</div>

    <script>
        function cambiarMetodo() {
            let seleccion = document.getElementById('metodoSeleccionado').value;
            let secciones = document.getElementsByClassName('metodo-seccion');
            for(let i=0; i < secciones.length; i++) {
                secciones[i].classList.remove('active');
            }
            
            if(seleccion === 'rula') document.getElementById('sec-rula').classList.add('active');
            if(seleccion === 'rosa') document.getElementById('sec-rosa').classList.add('active');

            let contenedorResultado = document.getElementById('resultado');
            contenedorResultado.style.display = "none";
            contenedorResultado.className = "resultado-box";
        }

        function procesarEvaluacion() {
            let metodo = document.getElementById('metodoSeleccionado').value;
            let puntajeFinal = 0;
            let diagnostico = "";
            let nivelRiesgo = ""; // 'bajo', 'medio', 'alto'

            if (metodo === 'rula') {
                let brazo = parseInt(document.getElementById('rula-brazo').value);
                let cuello = parseInt(document.getElementById('rula-cuello').value);
                puntajeFinal = brazo + cuello;

                if (puntajeFinal <= 3) {
                    diagnostico = "<strong>Nivel de Acción 1:</strong> Postura aceptable si no se mantiene o repite durante largos períodos.";
                    nivelRiesgo = "bajo";
                } else if (puntajeFinal <= 5) {
                    diagnostico = "<strong>Nivel de Acción 2:</strong> Riesgo medio. Se requiere investigación adicional y pueden ser necesarios cambios.";
                    nivelRiesgo = "medio";
                } else if (puntajeFinal <= 6) {
                    diagnostico = "<strong>Nivel de Acción 3:</strong> Riesgo alto. Se requiere el estudio y modificaciones pronto.";
                    nivelRiesgo = "alto";
                } else {
                    diagnostico = "<strong>Nivel de Acción 4:</strong> Riesgo extremo. Se requieren cambios urgentes de forma inmediata de la tarea.";
                    nivelRiesgo = "alto";
                }

            } else if (metodo === 'rosa') {
                // Cálculo de la Silla de forma avanzada
                let sillaBaseRaw = document.getElementById('rosa-silla-base').value;
                let sillaBase = (sillaBaseRaw === "2_alto") ? 2 : parseInt(sillaBaseRaw);
                
                let adicionales = 0;
                if (document.getElementById('rosa-silla-espacio').checked) {
                    adicionales += 1;
                }
                if (document.getElementById('rosa-silla-regulable').checked) {
                    adicionales += 1;
                }
                
                // Sumatoria total de la silla (Puntuación Base + Acumulados)
                let totalSilla = sillaBase + adicionales;
                
                let pantalla = parseInt(document.getElementById('rosa-pantalla').value);
                
                // ROSA calcula el riesgo ponderando la peor postura encontrada más un factor base
                puntajeFinal = Math.max(totalSilla, pantalla) + 1;

                if (puntajeFinal <= 3) {
                    diagnostico = "<strong>Riesgo Aceptable:</strong> El puesto de oficina se encuentra adaptado ergonómicamente.";
                    nivelRiesgo = "bajo";
                } else if (puntajeFinal <= 5) {
                    diagnostico = "<strong>Riesgo Moderado:</strong> Se aconseja regular componentes del mobiliario.";
                    nivelRiesgo = "medio";
                } else {
                    diagnostico = "<strong>Riesgo Alto:</strong> El puesto supera los valores límites. Es obligatorio intervenir las dimensiones ergonómicas.";
                    nivelRiesgo = "alto";
                }
            }

            let contenedorResultado = document.getElementById('resultado');
            contenedorResultado.style.display = "block";
            
            contenedorResultado.className = "resultado-box";
            if(nivelRiesgo === "bajo") contenedorResultado.classList.add("resultado-bajo");
            if(nivelRiesgo === "medio") contenedorResultado.classList.add("resultado-medio");
            if(nivelRiesgo === "alto") contenedorResultado.classList.add("resultado-alto");

            contenedorResultado.innerHTML = `
                <strong>Método Aplicado:</strong> ${metodo.toUpperCase()}<br>
                <strong>Puntuación Indicativa Calculada:</strong> ${puntajeFinal} puntos<br><br>
                ${diagnostico}
            `;

            contenedorResultado.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
